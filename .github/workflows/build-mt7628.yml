name: Build OrayBox MT7628 boards

on:
  workflow_dispatch:
    inputs:
      boards:
        description: '空格分隔的板子目录名（默认 oraybox/mt7628/boards 下全部）'
        required: false
        type: string
        default: ''
      uboot_ref:
        description: 'mainline u-boot 版本（MT7628 自 v2020.07 起受支持）'
        required: false
        type: string
        default: 'v2024.07'
      pub_release:
        description: '汇总成 GitHub Release（默认只存 artifact）'
        required: false
        type: boolean
        default: false

# 默认 token 只读，发 Release 需要显式写权限
permissions:
  contents: write

jobs:
  discover:
    name: Collect MT7628 boards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          if [ -n "${{ inputs.boards }}" ]; then
            list=$(echo "${{ inputs.boards }}" | tr ' ,' '\n\n')
          else
            list=$(for d in oraybox/mt7628/boards/*/; do basename "$d"; done)
          fi
          for b in $list; do
            ls "oraybox/mt7628/boards/$b"/*_defconfig >/dev/null 2>&1 || { echo "::error::$b 缺 defconfig"; exit 1; }
          done
          matrix=$(for b in $list; do printf '"%s",' "$b"; done)
          echo "要编译 $(echo $list | wc -w) 块：$(echo $list)"
          echo "matrix=[${matrix%,}]" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.board }}
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: oray

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu device-tree-compiler bc bzip2 libssl-dev python3

      - name: Fetch mainline u-boot ${{ inputs.uboot_ref }}
        run: |
          git clone --depth 1 --branch "${{ inputs.uboot_ref }}" \
            https://source.denx.de/u-boot/u-boot.git u-boot \
            || git clone --depth 1 --branch "${{ inputs.uboot_ref }}" \
                 https://github.com/u-boot/u-boot.git u-boot

      - name: 安装板级 dts 与 defconfig
        run: |
          d=oraybox/mt7628/boards/${{ matrix.board }}
          cp "$d"/*.dts u-boot/arch/mips/dts/
          cp "$d"/*_defconfig u-boot/configs/
          echo "DEFCONFIG=$(basename $(ls "$d"/*_defconfig) .defconfig)" >> "$GITHUB_ENV"
          echo "DTS=$(basename $(ls "$d"/*.dts) .dts)" >> "$GITHUB_ENV"

      - name: 配置（记录 unknown symbol）
        working-directory: u-boot
        run: |
          make O=build CROSS_COMPILE=mipsel-linux-gnu- "$DEFCONFIG" 2>&1 | tee /tmp/cfg.log
          if grep -qi "unknown symbol" /tmp/cfg.log; then
            echo "::warning::defconfig 里有该 u-boot 版本不认识的符号，见 summary"
            { echo "### ${{ matrix.board }} unknown symbol"; grep -i "unknown symbol" /tmp/cfg.log; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 先编 DTB（不需要交叉编译器，早暴露 dts 问题）
        working-directory: u-boot
        run: make O=build CROSS_COMPILE=mipsel-linux-gnu- dtbs 2>&1 | tail -20

      - name: Build u-boot-with-spl.bin
        working-directory: u-boot
        run: |
          make O=build CROSS_COMPILE=mipsel-linux-gnu- -j"$(nproc)" 2>&1 | tail -30
          ls -l build/u-boot-with-spl.bin
          cp build/u-boot-with-spl.bin "$GITHUB_WORKSPACE/${{ matrix.board }}-u-boot-with-spl.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-uboot
          path: ${{ matrix.board }}-u-boot-with-spl.bin

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.pub_release }}
        with:
          name: release-7628-${{ matrix.board }}
          path: ${{ matrix.board }}-u-boot-with-spl.bin

  release:
    name: Publish combined MT7628 release
    needs: [discover, build]
    if: ${{ inputs.pub_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-7628-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: oraybox-mt7628-${{ github.run_number }}-${{ github.run_id }}
          name: OrayBox MT7628 u-boot (run ${{ github.run_number }})
          body: |
            - mainline u-boot: ${{ inputs.uboot_ref }}
            - 板级文件来自 `oraybox/mt7628/boards/`，派生自固件内核 DTB，未全部上机验证
            - 刷写前核对分区表；`factory` 分区不要写，有砖机风险
          files: dist/*
