name: Check OrayBox board files

on:
  push:
    paths:
      - "configs-mt7621/oray_*"
      - "oraybox/**"
      - "build.sh"
      - "customize.sh"
      - ".github/workflows/check-boards.yml"
  pull_request:
    paths:
      - "configs-mt7621/oray_*"
      - "oraybox/**"
  workflow_dispatch:

jobs:
  check:
    name: build.sh 解析与校验（不编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 跑 oraybox/tools/check-boards.sh
        run: bash oraybox/tools/check-boards.sh "$(pwd)"

      - name: 校验 X4C 的板级 DTS 能编成 DTB
        run: |
          sudo apt-get update && sudo apt-get install -y device-tree-compiler
          # 与 build-mainline.yml 的默认版本保持一致；脚本会扫 mt7628 + mt7620 两条线
          UBOOT_REF=v2026.07 bash oraybox/tools/check-dts.sh
