name: Check OrayBox board files

on:
  push:
    paths:
      - "configs-mt7621/oray_*"
      - "oraybox/**"
      - "build.sh"
      - "customize.sh"
      - ".github/workflows/check-boards.yml"
  pull_request:
    paths:
      - "configs-mt7621/oray_*"
      - "oraybox/**"
  workflow_dispatch:

jobs:
  check:
    name: build.sh 解析与校验（不编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 板目录结构断言（一目录一份 dts/defconfig，且 dts 名 == DEFAULT_DEVICE_TREE）
        run: |
          bad=0
          for d in oraybox/mt7628/oraybox-x4c/ oraybox/mt7628/boards/*/ oraybox/mt7620/boards/*/; do
            nd=$(ls "$d"*.dts 2>/dev/null | wc -l); nc=$(ls "$d"*_defconfig 2>/dev/null | wc -l)
            if [ "$nd" != 1 ] || [ "$nc" != 1 ]; then
              echo "::error::$d 应该有且只有 1 份 dts + 1 份 defconfig（实际 dts=$nd defconfig=$nc）"; bad=1; continue
            fi
            base=$(basename "$(ls "$d"*.dts)" .dts)
            want=$(grep -oP '(?<=CONFIG_DEFAULT_DEVICE_TREE=")[^"]+' "$(ls "$d"*_defconfig)")
            if [ "$base" != "$want" ]; then
              echo "::error::$d 的 defconfig 指向 $want，但目录里的 dts 是 $base"; bad=1
            fi
          done
          exit $bad

      - name: env 槽不得越界（不得压到 u-boot 或 factory）
        run: python3 oraybox/tools/check-env-slot.py oraybox

      - name: 跑 oraybox/tools/check-boards.sh
        run: bash oraybox/tools/check-boards.sh "$(pwd)"

      - name: 校验 X4C 的板级 DTS 能编成 DTB
        run: |
          sudo apt-get update && sudo apt-get install -y device-tree-compiler
          # 与 build-mainline.yml 的默认版本保持一致；脚本会扫 mt7628 + mt7620 两条线
          UBOOT_REF=v2026.07 bash oraybox/tools/check-dts.sh
